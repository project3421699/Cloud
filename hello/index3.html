<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Solar System — Three.js</title>

    <!-- =====================================================================
         STYLES
         Full-screen canvas, dark space backdrop, and a small HUD overlay.
         ===================================================================== -->
    <style>
        /* Reset + lock the page so the WebGL canvas owns the whole viewport */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;            /* no scrollbars — the scene fills the screen */
            background: #000;            /* pure black behind the starfield */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e8e8f0;
        }

        /* The renderer's <canvas> is injected into this container */
        #scene-container {
            position: fixed;
            inset: 0;                    /* top/right/bottom/left: 0 */
        }

        /* Heads-up display: title + quick instructions, non-interactive */
        #hud {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10;
            pointer-events: none;        /* clicks pass through to OrbitControls */
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
        #hud h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #hud p {
            margin-top: 6px;
            font-size: 12px;
            opacity: 0.75;
            line-height: 1.5;
        }
        #hud kbd {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: monospace;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <!-- 3D scene mounts here -->
    <div id="scene-container"></div>

    <!-- Overlay text -->
    <div id="hud">
        <h1>🪐 Interactive Solar System</h1>
        <p>
            <kbd>Left-drag</kbd> rotate &nbsp;·&nbsp;
            <kbd>Right-drag</kbd> pan &nbsp;·&nbsp;
            <kbd>Scroll</kbd> zoom
        </p>
    </div>

    <!-- =====================================================================
         DEPENDENCIES (Three.js r128 + OrbitControls via CDN)
         OrbitControls (examples/js) attaches itself to the global THREE.
         ===================================================================== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- =====================================================================
         MAIN SCRIPT
         ===================================================================== -->
    <script>
    (function () {
        'use strict';

        /* =================================================================
           1) SCENE SETUP
              Renderer, Scene, Camera, OrbitControls, lights, resize,
              and the particle starfield.
           ================================================================= */

        const container = document.getElementById('scene-container');

        // --- Renderer -----------------------------------------------------
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;                 // enable shadow mapping
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;  // soft shadow edges
        container.appendChild(renderer.domElement);

        // --- Scene --------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);      // near-black space

        // --- Camera -------------------------------------------------------
        const camera = new THREE.PerspectiveCamera(
            55,                                     // field of view
            window.innerWidth / window.innerHeight, // aspect ratio
            0.1,                                    // near plane
            2000                                    // far plane (must reach the starfield)
        );
        camera.position.set(0, 60, 140);

        // --- OrbitControls ------------------------------------------------
        // Left-drag = orbit/rotate, right-drag = pan, wheel = zoom.
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;        // smooth, weighty feel
        controls.dampingFactor = 0.05;
        controls.minDistance = 20;            // how close you can zoom in
        controls.maxDistance = 600;           // how far you can zoom out
        controls.target.set(0, 0, 0);         // look at the Sun

        // --- Lighting -----------------------------------------------------
        // The Sun is a self-lit (MeshBasicMaterial) sphere, but we ALSO drop a
        // PointLight at the center so planets receive realistic directional
        // light + cast shadows away from the Sun.
        const sunLight = new THREE.PointLight(0xffffff, 2.2, 0, 1); // color, intensity, distance(0=infinite), decay
        sunLight.position.set(0, 0, 0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(1024, 1024);
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 600;
        scene.add(sunLight);

        // A faint ambient so the night sides of planets aren't pure black.
        scene.add(new THREE.AmbientLight(0x222233, 0.6));

        // --- Starfield (THREE.Points) ------------------------------------
        // Scatter thousands of tiny points on a large sphere shell to fake depth.
        function createStarfield(count, radius) {
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                // Random direction on a sphere, pushed out to `radius`.
                const r = radius * (0.6 + Math.random() * 0.4);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions[i * 3 + 0] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.cos(phi);
                positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.2,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.9,
                depthWrite: false            // stars never occlude each other oddly
            });
            return new THREE.Points(geometry, material);
        }
        const stars = createStarfield(6000, 1200);
        scene.add(stars);

        // --- Resize handling ---------------------------------------------
        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


        /* =================================================================
           2) OBJECT CREATION
              Sun, planets (with orbit groups), Saturn's rings, Earth's moon
              (hierarchical Group), and faint orbit-path rings.
           ================================================================= */

        // Helper: a thin ring line on the XZ plane to visualize an orbit path.
        function createOrbitPath(radius, color) {
            const segments = 128;
            const pts = [];
            for (let i = 0; i <= segments; i++) {
                const a = (i / segments) * Math.PI * 2;
                pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.25 });
            return new THREE.LineLoop(geo, mat);
        }

        // --- The Sun ------------------------------------------------------
        // Self-luminous: MeshBasicMaterial ignores scene lights, so the Sun
        // glows regardless of the PointLight. A second, larger, additive
        // "glow" sphere fakes a corona halo.
        const sun = new THREE.Mesh(
            new THREE.SphereGeometry(12, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0xffcc33 })
        );
        sun.name = 'Sun';
        scene.add(sun);

        const sunGlow = new THREE.Mesh(
            new THREE.SphereGeometry(15, 64, 64),
            new THREE.MeshBasicMaterial({
                color: 0xffaa22,
                transparent: true,
                opacity: 0.18,
                side: THREE.BackSide   // render the inside-facing shell for a halo
            })
        );
        sun.add(sunGlow);

        // --- Planet factory ----------------------------------------------
        // Returns a pivot Group that revolves around the Sun (its rotation.y
        // is animated). The planet mesh sits offset on X inside that pivot.
        const planets = [];   // { pivot, mesh, orbitSpeed, spinSpeed }

        function createPlanet(options) {
            const {
                name, radius, distance, color,
                orbitSpeed, spinSpeed, tilt = 0
            } = options;

            // Orbit pivot: rotating this Group makes the planet circle the Sun.
            const pivot = new THREE.Group();
            pivot.name = name + 'Orbit';
            scene.add(pivot);

            // Faint orbit path drawn on the ground plane.
            scene.add(createOrbitPath(distance, 0x444466));

            // The planet itself, offset outward along +X from the pivot center.
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 48, 48),
                new THREE.MeshStandardMaterial({
                    color: color,
                    roughness: 0.85,
                    metalness: 0.05
                })
            );
            mesh.position.x = distance;
            mesh.rotation.z = tilt;          // axial tilt (e.g. Saturn)
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            pivot.add(mesh);

            const record = { pivot, mesh, orbitSpeed, spinSpeed, name };
            planets.push(record);
            return record;
        }

        // Define 4+ planets. Distances/sizes are scaled for visual clarity,
        // but inner planets get larger orbitSpeed (move faster) per spec.
        createPlanet({ name: 'Mercury', radius: 2.0, distance: 24,  color: 0x9c8b7a, orbitSpeed: 0.048, spinSpeed: 0.010 });
        createPlanet({ name: 'Venus',   radius: 3.4, distance: 38,  color: 0xd9a066, orbitSpeed: 0.035, spinSpeed: 0.008 });
        const earth = createPlanet({ name: 'Earth', radius: 3.8, distance: 56, color: 0x3a7bd5, orbitSpeed: 0.027, spinSpeed: 0.020 });
        const saturn = createPlanet({ name: 'Saturn', radius: 6.0, distance: 92, color: 0xc9b27c, orbitSpeed: 0.016, spinSpeed: 0.018, tilt: 0.47 });

        // --- Saturn's Rings ----------------------------------------------
        // RingGeometry lies in the XY plane by default; rotate it flat (X axis)
        // and parent it to Saturn so it follows the planet.
        (function addSaturnRings() {
            const inner = saturn.mesh.geometry.parameters.radius + 3;
            const outer = inner + 8;
            const ringGeo = new THREE.RingGeometry(inner, outer, 96);

            // Tweak UVs so a radial gradient texture would map cleanly
            // (here we just use a flat translucent material).
            const ringMat = new THREE.MeshStandardMaterial({
                color: 0xd8c79a,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.75,
                roughness: 1.0
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;     // lay it flat around the equator
            ring.receiveShadow = true;
            saturn.mesh.add(ring);             // child of Saturn ⇒ inherits orbit + tilt
        })();

        // --- Earth's Moon (hierarchical Group) ---------------------------
        // We create an "earthAnchor" Group placed at Earth's orbit offset,
        // parented to the SAME pivot as Earth. Inside the anchor we put:
        //   • earthMesh  -> spins on its own axis (axial rotation)
        //   • moonPivot  -> rotates to carry the moon around Earth *locally*
        // Because moonPivot is a child of the anchor (not the spinning mesh),
        // the moon orbits Earth without inheriting Earth's axial spin.
        (function addMoon() {
            // Anchor at Earth's position, sharing Earth's revolution pivot.
            const earthAnchor = new THREE.Group();
            earthAnchor.position.x = earth.mesh.position.x;
            earth.pivot.add(earthAnchor);

            // Moon revolution pivot (rotated locally around Earth's center).
            const moonPivot = new THREE.Group();
            earthAnchor.add(moonPivot);

            const moon = new THREE.Mesh(
                new THREE.SphereGeometry(1.1, 32, 32),
                new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 1.0 })
            );
            moon.position.x = earth.mesh.geometry.parameters.radius + 6; // local distance from Earth
            moon.castShadow = true;
            moon.receiveShadow = true;
            moonPivot.add(moon);

            // Expose for the animation loop.
            earth.moonPivot = moonPivot;
            earth.moonSpin = 0.045;
        })();


        /* =================================================================
           3) ANIMATION LOOP
              requestAnimationFrame → update rotations/transforms → render.
              Inner planets already have larger orbitSpeed values above, so
              they naturally revolve faster.
           ================================================================= */

        const MOON_ORBIT_SPEED = 0.045;

        function animate() {
            requestAnimationFrame(animate);

            // Sun: gentle self-rotation (purely cosmetic; it's self-lit).
            sun.rotation.y += 0.0015;

            // Planets: revolve (pivot) + spin on own axis (mesh).
            for (let i = 0; i < planets.length; i++) {
                const p = planets[i];
                p.pivot.rotation.y += p.orbitSpeed;   // orbit the Sun
                p.mesh.rotation.y  += p.spinSpeed;    // axial rotation
            }

            // Moon: revolve locally around Earth.
            if (earth.moonPivot) {
                earth.moonPivot.rotation.y += earth.moonSpin;
            }

            // Slowly rotate the starfield for subtle parallax depth.
            stars.rotation.y += 0.0002;

            controls.update();          // required because damping is enabled
            renderer.render(scene, camera);
        }

        animate();
    })();
    </script>
</body>
</html>
