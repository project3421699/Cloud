<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbeatable Tic-Tac-Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --accent: #14b8a6;
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --x-color: #38bdf8;
            --o-color: #f472b6;
            --win-color: #facc15;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
            animation: float 15s infinite ease-in-out;
        }

        .particle:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 120px; height: 120px; top: 70%; left: 80%; animation-delay: -2s; }
        .particle:nth-child(3) { width: 60px; height: 60px; top: 40%; left: 90%; animation-delay: -4s; }
        .particle:nth-child(4) { width: 100px; height: 100px; top: 80%; left: 20%; animation-delay: -6s; }
        .particle:nth-child(5) { width: 70px; height: 70px; top: 20%; left: 60%; animation-delay: -8s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            25% { transform: translate(30px, -30px) scale(1.1); opacity: 0.6; }
            50% { transform: translate(-20px, 20px) scale(0.9); opacity: 0.4; }
            75% { transform: translate(20px, 10px) scale(1.05); opacity: 0.5; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            perspective: 1000px;
        }

        .game-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 35px;
            box-shadow: var(--shadow);
            transform-style: preserve-3d;
            animation: cardEntry 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardEntry {
            from { opacity: 0; transform: translateY(40px) rotateX(10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px 24px;
            min-width: 90px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .score-box.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary-light);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }

        .score-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .x-score .score-value { color: var(--x-color); }
        .o-score .score-value { color: var(--o-color); }
        .draw-score .score-value { color: var(--accent); }

        .status {
            text-align: center;
            margin-bottom: 25px;
            min-height: 32px;
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            transition: all 0.3s ease;
        }

        .status-text span {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
            position: relative;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            color: inherit;
            font-family: inherit;
            padding: 0;
            width: 100%;
        }

        .cell:hover:not(.taken):not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .cell.taken,
        .cell:disabled {
            cursor: default;
        }

        .cell:focus-visible {
            outline: 2px solid var(--primary-light);
            outline-offset: 2px;
        }

        .cell.winner {
            background: rgba(250, 204, 21, 0.15);
            border-color: var(--win-color);
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
            animation: winnerPulse 1s ease-in-out infinite alternate;
        }

        @keyframes winnerPulse {
            from { box-shadow: 0 0 20px rgba(250, 204, 21, 0.2); }
            to { box-shadow: 0 0 40px rgba(250, 204, 21, 0.5); }
        }

        .mark {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            animation: markAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes markAppear {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .mark-x {
            color: var(--x-color);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .mark-o {
            color: var(--o-color);
            text-shadow: 0 0 20px rgba(244, 114, 182, 0.5);
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .difficulty {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .difficulty-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: var(--shadow);
            transform: scale(0.8) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.show .modal {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 1s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .modal-message {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .turn-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .turn-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--x-color);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 99;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .game-card { padding: 25px 20px; }
            .cell { font-size: 2.5rem; border-radius: 14px; }
            .score-box { padding: 10px 18px; min-width: 75px; }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <div class="game-card">
            <header>
                <h1>Tic-Tac-Toe</h1>
                <p class="subtitle">Can you beat the AI?</p>
            </header>

            <div class="difficulty">
                <button class="difficulty-btn active" data-level="unbeatable">Unbeatable</button>
                <button class="difficulty-btn" data-level="hard">Hard</button>
                <button class="difficulty-btn" data-level="medium">Medium</button>
                <button class="difficulty-btn" data-level="easy">Easy</button>
            </div>

            <div class="score-board">
                <div class="score-box x-score active" id="xScoreBox">
                    <div class="score-label">You (X)</div>
                    <div class="score-value" id="xScore">0</div>
                </div>
                <div class="score-box draw-score">
                    <div class="score-label">Draws</div>
                    <div class="score-value" id="drawScore">0</div>
                </div>
                <div class="score-box o-score" id="oScoreBox">
                    <div class="score-label">AI (O)</div>
                    <div class="score-value" id="oScore">0</div>
                </div>
            </div>

            <div class="status">
                <div class="status-text" id="statusText">
                    <span class="turn-indicator">
                        <span class="turn-dot"></span>
                        Your turn
                    </span>
                </div>
            </div>

            <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe board">
                <button class="cell" data-index="0" aria-label="Cell 1"></button>
                <button class="cell" data-index="1" aria-label="Cell 2"></button>
                <button class="cell" data-index="2" aria-label="Cell 3"></button>
                <button class="cell" data-index="3" aria-label="Cell 4"></button>
                <button class="cell" data-index="4" aria-label="Cell 5"></button>
                <button class="cell" data-index="5" aria-label="Cell 6"></button>
                <button class="cell" data-index="6" aria-label="Cell 7"></button>
                <button class="cell" data-index="7" aria-label="Cell 8"></button>
                <button class="cell" data-index="8" aria-label="Cell 9"></button>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" id="resetScoresBtn">Reset Scores</button>
                <button class="btn btn-primary" id="newGameBtn">New Game</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">🏆</div>
            <h2 class="modal-title" id="modalTitle">Game Over</h2>
            <p class="modal-message" id="modalMessage">The AI wins!</p>
            <button class="btn btn-primary" id="modalNewGameBtn" style="width: 100%;">Play Again</button>
        </div>
    </div>

    <script>
        const WIN_PATTERNS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        class TicTacToe {
            constructor() {
                this.board = Array(9).fill('');
                this.human = 'X';
                this.ai = 'O';
                this.currentPlayer = this.human;
                this.gameActive = true;
                this.difficulty = 'unbeatable';
                this.scores = { X: 0, O: 0, draw: 0 };
                this.winningCombo = null;

                this.cells = document.querySelectorAll('.cell');
                this.statusText = document.getElementById('statusText');
                this.xScoreEl = document.getElementById('xScore');
                this.oScoreEl = document.getElementById('oScore');
                this.drawScoreEl = document.getElementById('drawScore');
                this.xScoreBox = document.getElementById('xScoreBox');
                this.oScoreBox = document.getElementById('oScoreBox');
                this.modalOverlay = document.getElementById('modalOverlay');
                this.modalTitle = document.getElementById('modalTitle');
                this.modalMessage = document.getElementById('modalMessage');
                this.modalIcon = document.getElementById('modalIcon');

                this.init();
            }

            init() {
                this.cells.forEach(cell => {
                    cell.addEventListener('click', () => this.handleCellClick(cell));
                });

                document.getElementById('newGameBtn').addEventListener('click', () => this.resetGame());
                document.getElementById('modalNewGameBtn').addEventListener('click', () => this.resetGame());
                document.getElementById('resetScoresBtn').addEventListener('click', () => this.resetScores());

                document.querySelectorAll('.difficulty-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.setDifficulty(btn));
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') this.hideModal();
                });

                this.updateStatus();
            }

            setDifficulty(btn) {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.difficulty = btn.dataset.level;
                this.resetGame();
            }

            handleCellClick(cell) {
                const index = parseInt(cell.dataset.index);
                if (!this.gameActive || this.board[index] !== '') return;

                this.makeMove(index, this.human);

                if (this.gameActive) {
                    this.updateStatus();
                    setTimeout(() => this.aiMove(), 400);
                }
            }

            makeMove(index, player) {
                this.board[index] = player;
                const cell = this.cells[index];
                cell.classList.add('taken');
                cell.disabled = true;

                const mark = document.createElement('div');
                mark.className = `mark mark-${player.toLowerCase()}`;
                mark.textContent = player;
                cell.appendChild(mark);

                this.playSound(player === this.human ? 600 : 400, 0.1);

                if (this.checkWin(player)) {
                    this.endGame(player);
                } else if (this.checkDraw()) {
                    this.endGame('draw');
                } else {
                    this.currentPlayer = player === this.human ? this.ai : this.human;
                }
            }

            aiMove() {
                if (!this.gameActive) return;

                let index;
                switch (this.difficulty) {
                    case 'easy':
                        index = this.getRandomMove();
                        break;
                    case 'medium':
                        index = Math.random() < 0.5 ? this.getBestMove() : this.getRandomMove();
                        break;
                    case 'hard':
                        index = Math.random() < 0.85 ? this.getBestMove() : this.getRandomMove();
                        break;
                    case 'unbeatable':
                    default:
                        index = this.getBestMove();
                        break;
                }

                this.makeMove(index, this.ai);
                this.updateStatus();
            }

            getRandomMove() {
                const available = this.board.map((val, idx) => val === '' ? idx : null).filter(v => v !== null);
                return available[Math.floor(Math.random() * available.length)];
            }

            getBestMove() {
                // Use minimax for unbeatable play
                let bestScore = -Infinity;
                let move = -1;

                for (let i = 0; i < 9; i++) {
                    if (this.board[i] === '') {
                        this.board[i] = this.ai;
                        const score = this.minimax(this.board, 0, false);
                        this.board[i] = '';
                        if (score > bestScore) {
                            bestScore = score;
                            move = i;
                        }
                    }
                }

                return move;
            }

            minimax(board, depth, isMaximizing) {
                const result = this.checkWinnerForMinimax();
                if (result !== null) {
                    return result;
                }

                if (isMaximizing) {
                    let bestScore = -Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (board[i] === '') {
                            board[i] = this.ai;
                            const score = this.minimax(board, depth + 1, false);
                            board[i] = '';
                            bestScore = Math.max(bestScore, score);
                        }
                    }
                    return bestScore;
                } else {
                    let bestScore = Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (board[i] === '') {
                            board[i] = this.human;
                            const score = this.minimax(board, depth + 1, true);
                            board[i] = '';
                            bestScore = Math.min(bestScore, score);
                        }
                    }
                    return bestScore;
                }
            }

            checkWinnerForMinimax() {
                for (const pattern of WIN_PATTERNS) {
                    const [a, b, c] = pattern;
                    if (this.board[a] && this.board[a] === this.board[b] && this.board[a] === this.board[c]) {
                        return this.board[a] === this.ai ? 10 : -10;
                    }
                }

                if (!this.board.includes('')) return 0;
                return null;
            }

            checkWin(player) {
                for (const pattern of WIN_PATTERNS) {
                    const [a, b, c] = pattern;
                    if (this.board[a] === player && this.board[b] === player && this.board[c] === player) {
                        this.winningCombo = pattern;
                        return true;
                    }
                }
                return false;
            }

            checkDraw() {
                return !this.board.includes('');
            }

            endGame(result) {
                this.gameActive = false;

                if (result === 'draw') {
                    this.scores.draw++;
                    this.drawScoreEl.textContent = this.scores.draw;
                    this.showModal('🤝', 'It\'s a Draw!', 'Great match! Try again.');
                } else {
                    this.scores[result]++;
                    if (result === this.human) {
                        this.xScoreEl.textContent = this.scores.X;
                        this.highlightWinners();
                        this.createConfetti();
                        this.showModal('🎉', 'You Win!', 'Congratulations, you defeated the AI!');
                    } else {
                        this.oScoreEl.textContent = this.scores.O;
                        this.highlightWinners();
                        this.showModal('🤖', 'AI Wins!', 'The machine prevails this time.');
                    }
                }

                this.updateStatus();
            }

            highlightWinners() {
                if (this.winningCombo) {
                    this.winningCombo.forEach(index => {
                        this.cells[index].classList.add('winner');
                    });
                }
            }

            showModal(icon, title, message) {
                this.modalIcon.textContent = icon;
                this.modalTitle.textContent = title;
                this.modalMessage.textContent = message;
                setTimeout(() => this.modalOverlay.classList.add('show'), 600);
            }

            hideModal() {
                this.modalOverlay.classList.remove('show');
            }

            updateStatus() {
                const isHumanTurn = this.currentPlayer === this.human;
                this.xScoreBox.classList.toggle('active', isHumanTurn);
                this.oScoreBox.classList.toggle('active', !isHumanTurn);

                if (this.gameActive) {
                    const dotColor = isHumanTurn ? 'var(--x-color)' : 'var(--o-color)';
                    const text = isHumanTurn ? 'Your turn' : 'AI thinking...';
                    this.statusText.innerHTML = `<span class="turn-indicator" style="--dot-color: ${dotColor}"><span class="turn-dot" style="background: ${dotColor}"></span>${text}</span>`;
                } else {
                    this.statusText.innerHTML = `<span>Game over</span>`;
                }
            }

            resetGame() {
                this.board = Array(9).fill('');
                this.currentPlayer = this.human;
                this.gameActive = true;
                this.winningCombo = null;

                this.cells.forEach(cell => {
                    cell.classList.remove('taken', 'winner');
                    cell.innerHTML = '';
                    cell.disabled = false;
                });

                this.hideModal();
                this.updateStatus();
            }

            resetScores() {
                this.scores = { X: 0, O: 0, draw: 0 };
                this.xScoreEl.textContent = '0';
                this.oScoreEl.textContent = '0';
                this.drawScoreEl.textContent = '0';
                this.resetGame();
            }

            createConfetti() {
                const colors = ['#38bdf8', '#f472b6', '#facc15', '#14b8a6', '#818cf8'];
                for (let i = 0; i < 50; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confetti.style.transition = `all ${1 + Math.random() * 2}s ease-out`;
                    document.body.appendChild(confetti);

                    setTimeout(() => {
                        confetti.style.transform = `translate(${Math.random() * 200 - 100}px, ${window.innerHeight}px) rotate(${Math.random() * 720}deg)`;
                        confetti.style.opacity = '0';
                    }, 10);

                    setTimeout(() => confetti.remove(), 3000);
                }
            }

            playSound(frequency, duration) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    const ctx = new AudioContext();
                    const oscillator = ctx.createOscillator();
                    const gainNode = ctx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    oscillator.frequency.value = frequency;
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                    oscillator.start();
                    oscillator.stop(ctx.currentTime + duration);
                } catch (e) {
                    // Audio not critical
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new TicTacToe();
        });
    </script>
</body>
</html>
