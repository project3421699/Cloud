<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbeatable Tic-Tac-Toe</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-color: #2c3e50;
            --accent-x: #ff8a80; /* Soft Rose */
            --accent-o: #81c784; /* Soft Sage */
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-weight: 500;
        }

        .score-item span {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .status {
            margin-bottom: 20px;
            font-size: 1.1rem;
            height: 1.5rem;
            font-weight: 400;
            transition: all 0.3s ease;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .cell:hover:not(.taken) {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.02);
        }

        .cell.taken {
            cursor: default;
        }

        .cell.win {
            background: rgba(255, 255, 255, 0.7);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .x-piece {
            color: var(--accent-x);
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .o-piece {
            color: var(--accent-o);
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        button {
            background: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-family: var(--font-family);
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        button:active {
            transform: translateY(0);
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Tic-Tac-Toe</h1>
    
    <div class="scoreboard">
        <div class="score-item">
            <span>Player</span>
            <div id="player-score">0</div>
        </div>
        <div class="score-item">
            <span>AI</span>
            <div id="ai-score">0</div>
        </div>
        <div class="score-item">
            <span>Draws</span>
            <div id="draw-score">0</div>
        </div>
    </div>

    <div class="status" id="status">Your Turn</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button id="reset-btn">Reset Match</button>
</div>

<script>
    const boardElement = document.getElementById('board');
    const cells = document.querySelectorAll('.cell');
    const statusElement = document.getElementById('status');
    const resetBtn = document.getElementById('reset-btn');
    const playerScoreElement = document.getElementById('player-score');
    const aiScoreElement = document.getElementById('ai-score');
    const drawScoreElement = document.getElementById('draw-score');

    let board = Array(9).fill(null);
    let currentPlayer = 'X'; // Player is X
    let gameActive = true;
    let scores = { player: 0, ai: 0, draw: 0 };

    const winPatterns = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // Cols
        [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    function handleCellClick(e) {
        const index = e.target.getAttribute('data-index');
        
        if (board[index] || !gameActive || currentPlayer !== 'X') return;

        makeMove(index, 'X');
        
        if (gameActive) {
            statusElement.innerText = "AI is thinking...";
            setTimeout(aiMove, 600);
        }
    }

    function makeMove(index, player) {
        board[index] = player;
        const cell = cells[index];
        cell.classList.add('taken');
        cell.innerHTML = `<span class="${player.toLowerCase()}-piece">${player}</span>`;
        
        if (checkWin(board, player)) {
            endGame(player);
        } else if (board.every(cell => cell !== null)) {
            endGame('draw');
        } else {
            currentPlayer = (player === 'X') ? 'O' : 'X';
            statusElement.innerText = (currentPlayer === 'X') ? "Your Turn" : "AI is thinking...";
        }
    }

    function aiMove() {
        if (!gameActive) return;
        const bestMove = minimax(board, 'O').index;
        makeMove(bestMove, 'O');
    }

    function checkWin(currentBoard, player) {
        return winPatterns.some(pattern => {
            return pattern.every(index => currentBoard[index] === player);
        });
    }

    function getWinPattern(currentBoard, player) {
        return winPatterns.find(pattern => {
            return pattern.every(index => currentBoard[index] === player);
        });
    }

    function endGame(result) {
        gameActive = false;
        if (result === 'draw') {
            statusElement.innerText = "It's a Draw!";
            scores.draw++;
            drawScoreElement.innerText = scores.draw;
        } else {
            const winner = (result === 'X') ? "You" : "AI";
            statusElement.innerText = winner + " Won!";
            
            if (result === 'X') scores.player++;
            else scores.ai++;
            
            playerScoreElement.innerText = scores.player;
            aiScoreElement.innerText = scores.ai;

            const pattern = getWinPattern(board, result);
            pattern.forEach(index => cells[index].classList.add('win'));
        }
    }

    function resetGame() {
        board = Array(9).fill(null);
        currentPlayer = 'X';
        gameActive = true;
        statusElement.innerText = "Your Turn";
        cells.forEach(cell => {
            cell.innerText = '';
            cell.className = 'cell';
        });
    }

    // Minimax Algorithm
    function minimax(newBoard, player) {
        const availSpots = newBoard.map((v, i) => v === null ? i : null).filter(v => v !== null);

        if (checkWin(newBoard, 'X')) return { score: -10 };
        if (checkWin(newBoard, 'O')) return { score: 10 };
        if (availSpots.length === 0) return { score: 0 };

        const moves = [];
        for (let i = 0; i < availSpots.length; i++) {
            const move = {};
            move.index = availSpots[i];
            newBoard[availSpots[i]] = player;

            if (player === 'O') {
                const result = minimax(newBoard, 'X');
                move.score = result.score;
            } else {
                const result = minimax(newBoard, 'O');
                move.score = result.score;
            }

            newBoard[availSpots[i]] = null;
            moves.push(move);
        }

        let bestMove;
        if (player === 'O') {
            let bestScore = -10000;
            for (let i = 0; i < moves.length; i++) {
                if (moves[i].score > bestScore) {
                    bestScore = moves[i].score;
                    bestMove = i;
                }
            }
        } else {
            let bestScore = 10000;
            for (let i = 0; i < moves.length; i++) {
                if (moves[i].score < bestScore) {
                    bestScore = moves[i].score;
                    bestMove = i;
                }
            }
        }
        return moves[bestMove];
    }

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    resetBtn.addEventListener('click', resetGame);
</script>

</body>
</html>
