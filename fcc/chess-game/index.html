<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chessmaster — Play vs Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <header class="brand">
        <div class="brand-mark">♛</div>
        <div class="brand-text">
          <h1>Chessmaster</h1>
          <span>You vs the Bot</span>
        </div>
      </header>

      <section class="panel">
        <label class="field-label" for="level">Difficulty</label>
        <select id="level" class="select">
          <option value="0">Level 1 · Pawn — Random</option>
          <option value="1">Level 2 · Knight — Depth 1</option>
          <option value="2">Level 3 · Bishop — Depth 2</option>
          <option value="3">Level 4 · Rook — Depth 3</option>
          <option value="4">Level 5 · Queen — Depth 4</option>
          <option value="5" selected>Level 6 · Grandmaster — Stockfish</option>
        </select>
        <p class="hint" id="level-hint">A strong opponent. Beat it to reach the Grandmaster.</p>
      </section>

      <section class="panel stats">
        <div class="stat">
          <span class="stat-label">You</span>
          <span class="stat-val" id="captured-by-bot">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Bot</span>
          <span class="stat-val" id="captured-by-you">—</span>
        </div>
      </section>

      <section class="panel">
        <label class="field-label">Controls</label>
        <div class="btn-row">
          <button id="new-game" class="btn btn-primary">New Game</button>
          <button id="flip" class="btn btn-ghost">Flip</button>
        </div>
        <p class="hint">Tip: watch the bot's moves to spot your own weaknesses.</p>
      </section>

      <div class="status-card" id="status">
        <span class="dot"></span>
        <span id="status-text">White to move</span>
      </div>
    </aside>

    <!-- ===== Board ===== -->
    <main class="board-wrap">
      <div class="board-frame">
        <div id="board" class="board"></div>
        <div class="coords" id="coords"></div>
      </div>

      <section class="moves-panel">
        <div class="moves-head">
          <h2>Move Log</h2>
          <span class="moves-count" id="move-count">0 moves</span>
        </div>
        <ol id="move-list" class="move-list"></ol>
      </section>
    </main>
  </div>

  <!-- Libraries (CDN) -->
  <script src="https://unpkg.com/chess.js@1.0.0-beta.8/dist/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
